[server]
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
baseRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
